name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install UltraVNC
        run: |
          choco install ultravnc -y --limit-output
          Start-Sleep -Seconds 10
          $installDir = "C:\Program Files\uvnc bvba\UltraVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\UltraVNC",
              "C:\Program Files (x86)\UltraVNC",
              "C:\Program Files\uvnc bvba\UltraVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }
          if (-not (Test-Path $installDir)) {
            Write-Host "❌ UltraVNC not found"
            exit 1
          }
          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ UltraVNC installed at $installDir"

      - name: Configure VNC for empty password (registry)
        run: |
          New-Item -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "AllowNullPassword" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "AuthRequired" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "UseRegistry" -Value 1 -Type DWord
          $emptyPass = [byte[]]@(0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00)
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "Password" -Value $emptyPass -Type Binary
          Write-Host "✅ VNC registry configured for empty password"

      - name: Start VNC server (restart to apply changes)
        run: |
          Get-Process -Name winvnc -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath "$env:VNC_PATH\winvnc.exe" -ArgumentList "-run" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $listening = netstat -an | Select-String ":5900"
          if ($listening) {
            Write-Host "✅ VNC server listening on port 5900"
            Write-Host $listening
          } else {
            Write-Host "❌ VNC server is not listening on port 5900"
            exit 1
          }
          Test-NetConnection -ComputerName localhost -Port 5900 -InformationLevel Quiet
          if ($?) { Write-Host "✅ Local connection to VNC succeeded" } else { Write-Host "⚠️ Local connection failed – tunnel may not work" }

      - name: Expose VNC via Cloudflare TCP tunnel
        run: |
          $outFile = "$env:TEMP\cf_out.log"
          $errFile = "$env:TEMP\cf_err.log"
          # Start cloudflared and redirect both streams to files
          $proc = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:5900 --loglevel debug" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "Cloudflared process started with PID $($proc.Id)"

          $timeout = 90  # seconds
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $tunnelUrl = $null
          $lastLogSize = 0

          while ($sw.Elapsed.TotalSeconds -lt $timeout) {
            # Read new content from both log files
            if (Test-Path $outFile) {
              $content = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              if ($content -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $matches[0]
                break
              }
            }
            if (Test-Path $errFile) {
              $errContent = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              if ($errContent -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $matches[0]
                break
              }
            }

            # Print a status update every 10 seconds
            if ($sw.Elapsed.TotalSeconds % 10 -lt 1) {
              Write-Host "Still waiting for tunnel URL... ($([math]::Round($sw.Elapsed.TotalSeconds))s elapsed)"
            }

            Start-Sleep -Seconds 1
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ No tunnel URL found within $timeout seconds."
            Write-Host "Last 20 lines of stdout:"
            Get-Content $outFile -Tail 20 -ErrorAction SilentlyContinue
            Write-Host "Last 20 lines of stderr:"
            Get-Content $errFile -Tail 20 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force
            exit 1
          }

          $hostname = $tunnelUrl -replace 'https://',''
          Write-Host "============================================"
          Write-Host "  🖥️  VNC READY – Eiciel OS"
          Write-Host "============================================"
          Write-Host "  Connect using any VNC client:"
          Write-Host "  Host: $hostname"
          Write-Host "  Port: 5900"
          Write-Host "  Password: (leave blank)"
          Write-Host "============================================"
          Write-Host "  The tunnel is active. This step will stay running"
          Write-Host "  until you cancel the workflow."
          Write-Host "  To stop, go to GitHub Actions and cancel this run."

          # Keep the job alive without blocking forever – check process health
          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "❌ Cloudflared process has exited. Tunnel is down."
              exit 1
            }
            # Optionally, print a heartbeat every 2 minutes
            if ((Get-Date).Minute % 2 -eq 0 -and (Get-Date).Second -lt 5) {
              Write-Host "💓 Tunnel still running (PID $($proc.Id))"
            }
          }
