name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (create lockfile)
        run: |
          npm install --package-lock-only
          npm ci

      - name: Build the protected app
        run: bash build-protected.sh

      # ─── FIX: Remove conflicting test files ──────────────────
      - name: Remove conflicting test files
        run: |
          rm -f security-attacks.spec.js
          rm -f tests/security-attacks.spec.js
          echo "✅ Only tests/security.spec.js remains:"
          ls -la tests/
        shell: bash

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run Playwright tests
        run: npm test
        env:
          EICIEL_TEST_MODE: 1
          EICIEL_EXE_PATH: D:/data/EicielOS/EicielOS-win32-x64/EicielOS.exe

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshot-*.png
