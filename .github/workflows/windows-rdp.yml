name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: chmod +x scripts/*.sh

      - run: bash scripts/build-eiciel-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-app-dist
          path: eiciel-app-dist/

  iso:
    runs-on: ubuntu-22.04
    needs: app
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-efi-amd64-bin grub-pc-bin \
            python3 curl jq

      - uses: actions/download-artifact@v4
        with:
          name: eiciel-app-dist
          path: eiciel-app-dist

      - run: chmod +x scripts/*.sh

      - run: |
          chmod +x eiciel-app-dist/EicielDashboard-linux-x64/EicielDashboard || true
          chmod +x eiciel-app-dist/eicield/eicield.py
          chmod +x eiciel-app-dist/eicield/install-daemon.sh

      - name: Check config file exists
        run: |
          set -euo pipefail
          if [ ! -f config/config.local.env ]; then
            echo "::error::config/config.local.env not found in repo"
            exit 1
          fi
          set -a
          . config/config.local.env
          set +a
          : "${MGMT_IP:?MGMT_IP missing in config/config.local.env}"
          : "${WEBHOOK_URL:?WEBHOOK_URL missing in config/config.local.env}"

      - run: sudo -E bash scripts/build-eiciel-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-server-iso
          path: eiciel-server.iso
