name: Build Eiciel OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ─── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── 2. Install build tools ──────────────────────────
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-efi-amd64-bin grub-pc-bin \
            nodejs npm

      # ─── 3. Install Electron dependencies ────────────────
      - name: Install Electron deps
        run: |
          cd eiciel-electron
          npm install --no-audit --no-fund --loglevel=error

      # ─── 4. Build Electron app for Linux x64 ─────────────
      - name: Build Linux app
        run: |
          cd eiciel-electron
          npx electron-packager . EicielOS \
            --platform=linux --arch=x64 \
            --out=./dist --overwrite --no-prune
          ls -la dist/

      # ─── 5. Build the ISO ────────────────────────────────
      - name: Build ISO
        run: |
          chmod +x build-eiciel-os.sh
          sudo -E bash build-eiciel-os.sh

      # ─── 6. Verify ISO exists ────────────────────────────
      - name: Verify ISO
        run: |
          ls -lh eiciel-os.iso || (echo "❌ ISO missing" && exit 1)

      # ─── 7. Upload ISO artifact ──────────────────────────
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiciel-os-iso
          path: eiciel-os.iso
          retention-days: 30
          compression-level: 0

      # ─── 8. Upload build log on failure ──────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-log
          path: build.log
          if-no-files-found: ignore
