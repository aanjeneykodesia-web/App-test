name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Fallback build
        run: |
          cd app/eiciel-electron
          npm install
          npm run build
        shell: bash
        if: failure()

      - name: Locate built executable
        id: locate
        run: |
          $exePath = "D:\data\EicielOS\EicielOS-win32-x64\EicielOS.exe"
          if (Test-Path $exePath) {
            Write-Host "✅ Executable found at: $exePath"
            echo "EXE_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "❌ Searching..."
            $candidates = @(
              ".\app\EicielOS-win32-x64\EicielOS.exe",
              ".\app\eiciel-electron\EicielOS-win32-x64\EicielOS.exe",
              ".\app\dist\EicielOS-win32-x64\EicielOS.exe"
            )
            foreach ($cand in $candidates) {
              if (Test-Path $cand) {
                $exePath = Resolve-Path $cand
                Write-Host "✅ Found at: $exePath"
                echo "EXE_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Append
                break
              }
            }
            if (-not $exePath) {
              Write-Host "❌ Executable not found."
              exit 1
            }
          }

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install UltraVNC
        run: |
          choco install ultravnc -y --limit-output
          Start-Sleep -Seconds 10

          $installDir = "C:\Program Files\uvnc bvba\UltraVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\UltraVNC",
              "C:\Program Files (x86)\UltraVNC",
              "C:\Program Files\uvnc bvba\UltraVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }

          if (-not (Test-Path $installDir)) {
            Write-Host "❌ Could not locate UltraVNC"
            exit 1
          }
          Write-Host "✅ UltraVNC at: $installDir"

          $vncServer = "$installDir\winvnc.exe"
          if (-not (Test-Path $vncServer)) {
            Write-Host "❌ winvnc.exe missing"
            Get-ChildItem $installDir
            exit 1
          }

          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set VNC password and start server
        run: |
          $vncDir = $env:VNC_PATH
          if (-not $vncDir) { Write-Host "VNC_PATH not set"; exit 1 }

          $vncServer = "$vncDir\winvnc.exe"
          $password = "P@ssw0rd123!"

          if (-not (Test-Path $vncServer)) {
            Write-Host "❌ winvnc.exe not found"
            exit 1
          }

          Start-Process -FilePath $vncServer -ArgumentList "-run -passwd $password" -WindowStyle Hidden

          Start-Sleep -Seconds 5
          netstat -an | findstr :5900
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Port 5900 not listening"
            Get-Process -Name winvnc -ErrorAction SilentlyContinue
          }

      - name: Setup noVNC
        run: |
          git clone --depth=1 https://github.com/novnc/noVNC.git C:\noVNC
          git clone --depth=1 https://github.com/novnc/websockify.git C:\websockify
          Start-Process -FilePath "python" -ArgumentList "C:\websockify\websockify.py --web C:\noVNC 6080 localhost:5900" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Write-Host "✅ noVNC running on http://localhost:6080"

      # ─── Expose noVNC via Cloudflare (HTTP tunnel) ──────────────
      - name: Expose web VNC via Cloudflare
        run: |
          # Start cloudflared in the background, redirect output to a temp file
          $logFile = "$env:TEMP\cloudflared.log"
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url http://localhost:6080 --loglevel debug" -RedirectStandardOutput $logFile -RedirectStandardError $logFile -WindowStyle Hidden -PassThru

          # Wait for the tunnel to establish and capture the URL
          $maxAttempts = 30
          $attempt = 0
          $tunnelUrl = $null
          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 2
            if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw
              # Look for the trycloudflare.com URL
              if ($content -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $matches[0]
                break
              }
            }
            $attempt++
            Write-Host "Waiting for tunnel URL... attempt $($attempt+1)/$maxAttempts"
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ Could not retrieve tunnel URL. Log content:"
            Get-Content $logFile
            exit 1
          }

          Write-Host "============================================"
          Write-Host "  WEB VNC READY – Eiciel OS KIOSK"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "  Open this URL in your browser: $tunnelUrl"
          Write-Host "  VNC Password: P@ssw0rd123!"
          Write-Host ""
          Write-Host "  (The noVNC interface will load – click Connect)"
          Write-Host "============================================"

          # Keep the tunnel alive by waiting for cloudflared to exit (it shouldn't)
          Wait-Process -Name cloudflared

      - name: Lock down to only the app
        run: |
          $exePath = $env:EXE_PATH
          if (-not $exePath) { Write-Host "❌ EXE_PATH not set"; exit 1 }
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v Shell /t REG_SZ /d "$exePath" /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System" /v DisableTaskMgr /t REG_DWORD /d 1 /f
          Write-Host "✅ Shell set to: $exePath"
