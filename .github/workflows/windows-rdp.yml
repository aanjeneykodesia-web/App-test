name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ─── Cache node_modules ──────────────────────────────────────
      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ─── Build the app ──────────────────────────────────────────
      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── Create the NEW mouse‑score security test ──────────────
      - name: Create Playwright Test File
        run: |
          cd ./app
          mkdir -p eiciel-electron/tests
          cat > eiciel-electron/tests/security.spec.js << "EOF"
          const { test, expect, _electron } = require('@playwright/test');
          const path = require('path');

          let app, window;

          test.beforeAll(async () => {
            test.setTimeout(60000); // allow time for decryption/startup

            const exePath = path.join('D:', 'data', 'EicielOS', 'EicielOS-win32-x64', 'EicielOS.exe');
            app = await _electron.launch({
              executablePath: exePath,
              env: { ...process.env, EICIEL_TEST_MODE: '1' }, // 👈 critical
            });
            window = await app.firstWindow();
            await window.waitForLoadState('domcontentloaded');

            // Auto-login (if login overlay appears)
            const loginOverlay = window.locator('#loginOverlay');
            if (await loginOverlay.isVisible()) {
              await window.locator('#loginPasskeyInput').fill('EICIEL-2026');
              await window.locator('#loginBtn').click();
              await window.locator('#desktopArea').waitFor({ state: 'visible' });
            }

            // Enable test mode – all breach actions are simulated
            await window.evaluate(() => window.api.enableTestMode());
          });

          test.afterAll(async () => {
            if (app) await app.close();
          });

          // ─── Only one test: verify mouse‑score breach ──────────
          test('Mouse‑score breach should trigger', async () => {
            // Trigger a low mouse score (score < 1)
            await window.evaluate(() => window.api.mouseScore(0));

            // Wait for breach to process
            await window.waitForTimeout(1500);

            // Verify spies
            const spies = await window.evaluate(() => window.api.getTestSpies());
            console.log('Spies:', spies);

            expect(spies.createBackupArchive).toBeGreaterThan(0);
            expect(spies.backupToCloud).toBeGreaterThan(0);
            expect(spies.wipeAllDrives).toBeGreaterThan(0);
            expect(spies.selfDestruct).toBeGreaterThan(0);
            expect(spies.onWipeRequest).toBeGreaterThan(0);
          });
          EOF
        shell: bash

      # ─── Install Playwright (if cache missed) ──────────────────
      - name: Install Playwright
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd ./app/eiciel-electron
          npm install @playwright/test
          npx playwright install chromium
        shell: bash

      # ─── Debug: list test files ──────────────────────────────────
      - name: List test files
        run: |
          cd ./app/eiciel-electron
          dir tests
        shell: bash

      # ─── Run the security test ──────────────────────────────────
      - name: Run Security Tests
        run: |
          cd ./app/eiciel-electron
          npm test   # uses cross-env to set EICIEL_TEST_MODE
        shell: bash
        env:
          CI: true
