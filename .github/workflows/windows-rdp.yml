name: Playwright Tests (9 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remove conflicting test files in the root
      - name: Clean up root test files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Patch the build script to use ./dist and environment variable in test file
      - name: Patch build script
        run: |
          $file = "build-protected.sh"
          $content = Get-Content $file -Raw
          # Change all D:/data/EicielOS to ./dist
          $content = $content -replace 'D:/data/EicielOS', './dist'
          # Replace the hardcoded exePath line inside the test file generation
          $content = $content -replace "const exePath = path.join\('\./dist', 'EicielOS-win32-x64', 'EicielOS.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join(__dirname, '..', 'dist', 'EicielOS-win32-x64', 'EicielOS.exe');"
          Set-Content $file $content
        shell: pwsh

      # Build the protected app
      - name: Build protected app
        run: bash build-protected.sh
        shell: bash

      # Double‑patch the generated test file (in case the build script patch didn't work)
      - name: Patch test file after build
        run: |
          $file = "eiciel-electron/tests/security.spec.js"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            # Replace the hardcoded exePath with environment variable
            $newContent = $content -replace "const exePath = path.join\('\./dist', 'EicielOS-win32-x64', 'EicielOS.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join(__dirname, '..', 'dist', 'EicielOS-win32-x64', 'EicielOS.exe');"
            Set-Content $file $newContent
            Write-Host "Test file patched successfully."
          } else {
            Write-Error "Test file not found after build!"
            exit 1
          }
        shell: pwsh

      # Verify the test file now uses the environment variable
      - name: Verify test file content
        run: |
          Select-String -Path "eiciel-electron/tests/security.spec.js" -Pattern "EICIEL_EXE_PATH"
        shell: pwsh

      # Install Playwright browsers inside eiciel-electron
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run the tests from inside eiciel-electron
      - name: Run Playwright tests
        run: |
          cd eiciel-electron
          npm test
        env:
          EICIEL_TEST_MODE: 1
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots if any
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            eiciel-electron/screenshot-*.png
            build.log
