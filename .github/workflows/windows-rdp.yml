name: Playwright Tests (9 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remove any conflicting test files in the root
      - name: Clean up root test files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Patch the build script:
      # 1. Change all hardcoded D:/data paths to ./dist
      # 2. Replace the test file's exePath with environment variable
      - name: Patch build script
        run: |
          $file = "build-protected.sh"
          $content = Get-Content $file -Raw
          # Change all D:/data/EicielOS to ./dist
          $content = $content -replace 'D:/data/EicielOS', './dist'
          # Replace the hardcoded exePath in the test file generation with env var
          $content = $content -replace "const exePath = path.join\('\./dist', 'EicielOS-win32-x64', 'EicielOS.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join(__dirname, 'dist', 'EicielOS-win32-x64', 'EicielOS.exe');"
          Set-Content $file $content
          # Show the patched test file section for debugging
          Write-Host "Patched test file line:"
          Select-String -Path $file -Pattern "exePath" -Context 0,0
        shell: pwsh

      # Now run the build script (it will output to ./dist inside eiciel-electron)
      - name: Build protected app
        run: bash build-protected.sh
        shell: bash

      # Verify the test file exists
      - name: Verify test file
        run: |
          if (-not (Test-Path "eiciel-electron/tests/security.spec.js")) {
            Write-Error "Test file not found!"
            exit 1
          }
        shell: pwsh

      # Install Playwright browsers inside eiciel-electron
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run the tests from inside eiciel-electron
      - name: Run Playwright tests
        run: |
          cd eiciel-electron
          npm test
        env:
          EICIEL_TEST_MODE: 1
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots and build log if any
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            eiciel-electron/screenshot-*.png
            build.log
