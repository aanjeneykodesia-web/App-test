name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: chmod +x scripts/*.sh

      - run: bash scripts/build-eiciel-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-app-dist
          path: eiciel-app-dist/

  iso:
    runs-on: ubuntu-22.04
    needs: app
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-efi-amd64-bin grub-pc-bin \
            python3 curl jq

      - uses: actions/download-artifact@v4
        with:
          name: eiciel-app-dist
          path: eiciel-app-dist

      - run: chmod +x scripts/*.sh

      - run: |
          chmod +x eiciel-app-dist/EicielDashboard-linux-x64/EicielDashboard || true
          chmod +x eiciel-app-dist/eicield/eicield.py
          chmod +x eiciel-app-dist/eicield/install-daemon.sh

      - name: Write config/config.local.env
        run: |
          set -euo pipefail
          mkdir -p config
          umask 077
          {
            printf 'MGMT_IP="%s"\n'            "10.0.0.1"
            printf 'WEBHOOK_URL="%s"\n'        "https://ntfy.sh/eiciel-alerts-x7k2p9q4"
            printf 'STOP_SERVICES="%s"\n'      "sshd nginx apache2 postgresql mysql mariadb redis-server docker"
            printf 'SSH_AUTHORIZED_KEY="%s"\n' ""
            printf 'ENABLE_PERSISTENCE=0\n'
            printf 'INCLUDE_DASHBOARD=auto\n'
            printf 'COOLDOWN_SECONDS=600\n'
            printf 'HOSTNAME_NEW="eiciel-srv"\n'
          } > config/config.local.env
          cat config/config.local.env

      - run: sudo -E bash scripts/build-eiciel-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-server-iso
          path: eiciel-server.iso
