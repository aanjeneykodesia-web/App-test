name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ─── 1. Clone your app repo ──────────────────────────────
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test   # <-- replace with your repo
          path: C:\app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      # ─── 2. Setup Node.js ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ─── 3. Build the protected app ──────────────────────────
      - name: Build Eiciel OS
        run: |
          cd C:\app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── 4. Install Playwright dependencies ──────────────────
      - name: Install Playwright
        run: |
          cd C:\app\eiciel-electron
          npm install
          npx playwright install chromium
        shell: bash

      # ─── 5. Run the security tests ───────────────────────────
      - name: Run Security Tests
        run: |
          cd C:\app\eiciel-electron
          npx playwright test security-attacks.spec.js --project=electron
        shell: bash
        env:
          CI: true
