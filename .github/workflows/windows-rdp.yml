name: Playwright – Tests 4 & 7 (screenshots always)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      EICIEL_TEST_MODE: '1'
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      - name: Reinstall dependencies in packaged app
        run: |
          cd "D:/data/EicielOS/EicielOS-win32-x64/resources/app"
          npm install --production --no-fund --no-audit
        shell: bash

      - name: Install Playwright browsers (if cache missed)
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd ./app/eiciel-electron
          npx playwright install chromium
        shell: bash

      - name: Run Tests 4 & 7 with screenshots
        run: |
          cd ./app/eiciel-electron
          npx playwright test -g "Mouse‑score breach should trigger|Self‑destruct on exit should trigger" --reporter=line --output=test-results
        env:
          CI: true
          EICIEL_TEST_MODE: '1'
          NODE_OPTIONS: "--max-old-space-size=8192"
          DEBUG: pw:electron
        shell: bash

      # ─── Upload all screenshots (even if tests pass) ──────────
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/eiciel-electron/screenshot-*.png
            app/eiciel-electron/test-results
          if-no-files-found: ignore
