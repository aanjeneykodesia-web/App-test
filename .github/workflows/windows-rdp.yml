name: Build & Test Eiciel OS (Playwright)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS (protected)
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Install Playwright browsers
        run: |
          cd app
          npx playwright install chromium

      - name: Run functional Playwright tests
        run: |
          cd app
          npx playwright test

      - name: Run security bot attacks
        run: |
          cd app
          npx playwright test bot-attack.spec.js
