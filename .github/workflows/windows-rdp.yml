name: Playwright Tests (9 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Generate a lockfile if missing, then install dependencies
      - name: Install dependencies (root)
        run: |
          npm install --package-lock-only || true
          npm ci || true
        shell: bash

      # Clean up any stray test files in the root
      - name: Remove conflicting test files (root)
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Build the protected app (this also installs dependencies inside eiciel-electron)
      - name: Build protected app
        run: |
          # Change build output from D:/data to ./dist in package.json
          (Get-Content package.json) -replace '"out":"D:/data/EicielOS"', '"out":"./dist"' | Set-Content package.json
          bash build-protected.sh
        shell: pwsh

      # Remove any leftover test files inside eiciel-electron (just in case)
      - name: Clean up inside eiciel-electron
        run: |
          cd eiciel-electron
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests\*.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue ..\*.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue ..\tests
        shell: pwsh

      # Patch the test file to use EICIEL_EXE_PATH environment variable
      - name: Patch test file
        run: |
          $file = "eiciel-electron/tests/security.spec.js"
          $content = Get-Content $file -Raw
          $newContent = $content -replace "const exePath = path.join\('D:', 'data', 'EicielOS', 'EicielOS-win32-x64', 'EicielOS.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join('D:', 'data', 'EicielOS', 'EicielOS-win32-x64', 'EicielOS.exe');"
          Set-Content $file $newContent
        shell: pwsh

      # Debug: list all test files
      - name: List test files
        run: |
          dir -Recurse -Filter *.spec.js
        shell: pwsh

      # Install Playwright browsers (inside eiciel-electron)
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run the tests from the eiciel-electron folder
      - name: Run Playwright tests
        run: |
          cd eiciel-electron
          npm test
        env:
          EICIEL_TEST_MODE: 1
          # The .exe is now in eiciel-electron/dist/...
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots (if any)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: eiciel-electron/screenshot-*.png
