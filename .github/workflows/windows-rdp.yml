name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      # ---------- TightVNC ----------
      - name: Install TightVNC
        run: |
          choco install tightvnc -y --limit-output
          $installDir = "C:\Program Files\TightVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\TightVNC",
              "C:\Program Files (x86)\TightVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }
          if (-not (Test-Path $installDir)) {
            Write-Host "❌ TightVNC not found"
            exit 1
          }
          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ TightVNC installed at $installDir"

      - name: Configure TightVNC with password 1234
        run: |
          $password = "1234"
          $passFile = "$env:TEMP\vncpass.txt"
          Set-Content -Path $passFile -Value $password -NoNewline
          Write-Host "✅ Password file created"

          Get-Process -Name tvnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          Start-Process -FilePath "$env:VNC_PATH\tvnserver.exe" -ArgumentList "-bind -port 5900 -passfile $passFile -service" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          $listening = netstat -an | Select-String ":5900"
          if ($listening) {
            Write-Host "✅ VNC server listening on port 5900"
          } else {
            Write-Host "❌ VNC server not listening"
            exit 1
          }

      # ---------- Python & websockify ----------
      - name: Install Python and websockify
        run: |
          choco install python -y --limit-output
          $possiblePaths = @(
            "C:\hostedtoolcache\windows\Python\3.14.7\x64\python.exe",
            "C:\hostedtoolcache\windows\Python\3.13.*\x64\python.exe",
            "C:\hostedtoolcache\windows\Python\3.12.*\x64\python.exe",
            "C:\Python314\python.exe",
            "C:\Python313\python.exe",
            "C:\Python312\python.exe"
          )
          $pythonExe = $null
          foreach ($p in $possiblePaths) {
            if (Test-Path $p) { $pythonExe = $p; break }
          }
          if (-not $pythonExe) {
            $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          }
          if (-not $pythonExe -or -not (Test-Path $pythonExe)) {
            Write-Host "❌ Python not found"
            exit 1
          }
          Write-Host "Using Python: $pythonExe"

          & $pythonExe -m pip install --upgrade pip
          & $pythonExe -m pip install websockify
          & $pythonExe -c "import websockify"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ websockify installation failed"
            exit 1
          }
          echo "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ websockify installed"

      - name: Start websockify (WebSocket proxy)
        run: |
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $logFile = "$env:TEMP\websockify.log"
          $errFile = "$env:TEMP\websockify.err"
          $proc = Start-Process -FilePath "$env:PYTHON_EXE" -ArgumentList "-m websockify 0.0.0.0:6080 localhost:5900" -RedirectStandardOutput $logFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "websockify PID: $($proc.Id)"

          Start-Sleep -Seconds 10
          $listening = netstat -an | Select-String ":6080"
          if ($listening) {
            Write-Host "✅ websockify is listening on port 6080"
          } else {
            Write-Host "❌ websockify not listening"
            Write-Host "--- stdout ---"
            Get-Content $logFile -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content $errFile -ErrorAction SilentlyContinue
            exit 1
          }

          if ($proc.HasExited) {
            Write-Host "❌ websockify died unexpectedly"
            Write-Host "--- stdout ---"
            Get-Content $logFile -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content $errFile -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "✅ websockify is stable"

      # ---------- ngrok ----------
      - name: Install ngrok
        run: |
          choco install ngrok -y --limit-output
          ngrok authtoken ${{ secrets.NGROK_TOKEN }}
          Write-Host "✅ ngrok installed and authenticated"

      - name: Expose WebSocket proxy via ngrok
        run: |
          $outFile = "$env:TEMP\ngrok_out.log"
          $errFile = "$env:TEMP\ngrok_err.log"
          $proc = Start-Process -FilePath "ngrok" -ArgumentList "http 6080 --log=stdout --log-level=debug" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "ngrok PID: $($proc.Id)"

          $timeout = 60
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $tunnelUrl = $null
          while ($sw.Elapsed.TotalSeconds -lt $timeout) {
            if (Test-Path $outFile) {
              $content = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              if ($content -match 'https://([a-z0-9-]+\.ngrok\.io)') {
                $tunnelUrl = "https://$($matches[1])"
                break
              }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ No ngrok URL found."
            Write-Host "stdout tail:"
            Get-Content $outFile -Tail 30 -ErrorAction SilentlyContinue
            Write-Host "stderr tail:"
            Get-Content $errFile -Tail 30 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force
            exit 1
          }

          Write-Host "============================================"
          Write-Host "  🌐 WebSocket Proxy READY – Eiciel OS"
          Write-Host "============================================"
          Write-Host "  Your VNC WebSocket endpoint:"
          Write-Host "  $tunnelUrl/websockify"
          Write-Host ""
          Write-Host "  Configure your noVNC client (on Vercel) with:"
          Write-Host "  - Host: $($tunnelUrl -replace 'https://','')"
          Write-Host "  - Port: 443"
          Write-Host "  - Path: /websockify"
          Write-Host "  - Password: 1234"
          Write-Host "============================================"
          Write-Host "  Tunnel stays active until you cancel the workflow."

          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "❌ ngrok exited. Tunnel down."
              exit 1
            }
          }
