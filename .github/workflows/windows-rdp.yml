name: Eiciel OS – Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev --no-fund --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (CI=false)
        run: |
          $env:CI = "false"
          bash deepseek_bash_20260903_2460b5_fixed.sh
        shell: pwsh

      - name: Run tests
        run: npm test
        env:
          EICIEL_TEST_MODE: 1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EicielOS-win32-x64
          path: D:/data/EicielOS/EicielOS-win32-x64
