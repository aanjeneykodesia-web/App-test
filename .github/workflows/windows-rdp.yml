name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      EICIEL_TEST_MODE: '1'   # global for all steps

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ─── Cache node_modules ──────────────────────────────────────
      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ─── Build the app (includes full test file creation) ──────
      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── DEBUG: Show loader log ─────────────────────────────────
      - name: Show loader log
        run: |
          if (Test-Path "$env:APPDATA\eiciel_loader.log") {
            Get-Content "$env:APPDATA\eiciel_loader.log"
          } else {
            Write-Host "Loader log not found."
          }
        shell: pwsh

      # ─── DEBUG: List packaged app contents ──────────────────────
      - name: List packaged app files
        run: |
          dir "D:/data/EicielOS/EicielOS-win32-x64/resources/app"
        shell: bash

      # ─── DEBUG: Test app startup (correct path) ────────────────
      - name: Test app startup
        run: |
          timeout 10 "D:/data/EicielOS/EicielOS-win32-x64/EicielOS.exe" || echo "App exited with code $?"
        shell: bash

      # ─── Reinstall dependencies inside packaged app (fallback) ──
      - name: Reinstall dependencies in packaged app
        run: |
          cd "D:/data/EicielOS/EicielOS-win32-x64/resources/app"
          npm install --production --no-fund --no-audit
        shell: bash

      # ─── Install Playwright browsers (if cache missed) ─────────
      - name: Install Playwright browsers
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd ./app/eiciel-electron
          npx playwright install chromium
        shell: bash

      # ─── Debug: list test files ──────────────────────────────────
      - name: List test files
        run: |
          cd ./app/eiciel-electron
          dir tests
        shell: bash

      # ─── Show test file content (verify 7 tests) ────────────────
      - name: Show test file content
        run: |
          cd ./app/eiciel-electron
          cat tests/security.spec.js
        shell: bash

      # ─── Run the security tests with verbose output ─────────────
      - name: Run Security Tests
        run: |
          cd ./app/eiciel-electron
          npx playwright test --reporter=line --timeout=120000
        shell: bash
        env:
          CI: true
          DEBUG: pw:electron   # enables Playwright Electron debug logs
