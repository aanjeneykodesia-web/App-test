name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Build the Electron dashboard
  # ─────────────────────────────────────────────────────────────
  app:
    name: Build dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build Electron dashboard
        run: ./scripts/build-eiciel-app.sh

      - name: Verify dashboard exists
        run: |
          ls -la eiciel-app-dist/EicielDashboard-linux-x64/
          test -x eiciel-app-dist/EicielDashboard-linux-x64/EicielDashboard
      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-dashboard
          path: eiciel-app-dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. Build the ISO inside Debian 12 (correct live-build)
  # ─────────────────────────────────────────────────────────────
  iso:
    name: Build ISO
    needs: app
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-efi-amd64-bin \
            grub-pc-bin \
            ca-certificates \
            git \
            curl
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: eiciel-dashboard
          path: eiciel-app-dist/

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Verify live-build version
        run: |
          lb --version
          echo "---"
          uname -a
          echo "---"
          mount | head -5
      - name: Build ISO
        env:
          MGMT_IP:            ${{ secrets.MGMT_IP }}
          WEBHOOK_URL:        ${{ secrets.WEBHOOK_URL }}
          SSH_AUTHORIZED_KEY: ${{ secrets.SSH_AUTHORIZED_KEY }}
          INCLUDE_DASHBOARD:  auto
        run: ./scripts/build-eiciel-iso.sh

      - name: Verify ISO
        run: |
          ls -lh eiciel-server.iso
          file eiciel-server.iso
      - uses: actions/upload-artifact@v4
        with:
          name: eiciel-server-iso
          path: eiciel-server.iso
          retention-days: 30

      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
