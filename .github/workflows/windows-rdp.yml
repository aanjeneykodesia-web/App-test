name: Build Eiciel OS & Upload Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      EICIEL_TEST_MODE: '0'   # Build in production mode (no test spies)
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      - name: List packaged app contents (debug)
        run: |
          dir "D:/data/EicielOS/EicielOS-win32-x64"
        shell: pwsh

      - name: Upload packaged app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: EicielOS-build
          path: D:/data/EicielOS/EicielOS-win32-x64
          if-no-files-found: error
