name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install TightVNC
        run: |
          choco install tightvnc -y --limit-output
          $installDir = "C:\Program Files\TightVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\TightVNC",
              "C:\Program Files (x86)\TightVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }
          if (-not (Test-Path $installDir)) {
            Write-Host "❌ TightVNC not found"
            exit 1
          }
          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ TightVNC installed at $installDir"

      - name: Configure TightVNC with password 1234
        run: |
          $password = "1234"
          $passFile = "$env:TEMP\vncpass.txt"
          Set-Content -Path $passFile -Value $password -NoNewline
          Write-Host "✅ Password file created"

          Get-Process -Name tvnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          Start-Process -FilePath "$env:VNC_PATH\tvnserver.exe" -ArgumentList "-bind -port 5900 -passfile $passFile -service" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          $listening = netstat -an | Select-String ":5900"
          if ($listening) {
            Write-Host "✅ VNC server listening on port 5900"
          } else {
            Write-Host "❌ VNC server not listening"
            exit 1
          }

      # ---------- FIXED: noVNC + websockify ----------
      - name: Clone noVNC and install websockify
        run: |
          git clone https://github.com/novnc/noVNC.git
          choco install python -y --limit-output
          # Force refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          # Upgrade pip and install websockify with --force-reinstall
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall websockify
          # Verify installation
          Write-Host "Verifying websockify installation..."
          python -m websockify --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ websockify module not found. Installed packages:"
            python -m pip list
            exit 1
          }
          Write-Host "✅ websockify installed successfully"

      - name: Start websockify (serving noVNC web interface)
        run: |
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          cd noVNC
          $logFile = "$env:TEMP\websockify.log"
          $errFile = "$env:TEMP\websockify.err"
          $proc = Start-Process -FilePath "python" -ArgumentList "-m websockify --web . 6080 localhost:5900" -RedirectStandardOutput $logFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "websockify PID: $($proc.Id)"

          Start-Sleep -Seconds 10
          $listening = netstat -an | Select-String ":6080"
          if ($listening) {
            Write-Host "✅ websockify is listening on port 6080"
          } else {
            Write-Host "❌ websockify not listening on 6080"
            Write-Host "--- websockify stdout ---"
            Get-Content $logFile -ErrorAction SilentlyContinue
            Write-Host "--- websockify stderr ---"
            Get-Content $errFile -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Expose noVNC via Cloudflare HTTP tunnel
        run: |
          $outFile = "$env:TEMP\cf_http_out.log"
          $errFile = "$env:TEMP\cf_http_err.log"
          $proc = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url http://localhost:6080 --loglevel debug" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "Cloudflared PID: $($proc.Id)"

          $timeout = 90
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $tunnelUrl = $null

          while ($sw.Elapsed.TotalSeconds -lt $timeout) {
            if (Test-Path $outFile) {
              $lines = Get-Content $outFile -ErrorAction SilentlyContinue
              foreach ($line in $lines) {
                if ($line -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                  $tunnelUrl = $line -replace '.*(https://[a-z0-9-]+\.trycloudflare\.com).*', '$1'
                  break
                }
              }
            }
            if ($tunnelUrl) { break }

            if (Test-Path $errFile) {
              $errLines = Get-Content $errFile -ErrorAction SilentlyContinue
              foreach ($line in $errLines) {
                if ($line -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                  $tunnelUrl = $line -replace '.*(https://[a-z0-9-]+\.trycloudflare\.com).*', '$1'
                  break
                }
              }
            }
            if ($tunnelUrl) { break }

            Start-Sleep -Seconds 1
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ No tunnel URL found."
            Write-Host "stdout tail:"
            Get-Content $outFile -Tail 20 -ErrorAction SilentlyContinue
            Write-Host "stderr tail:"
            Get-Content $errFile -Tail 20 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force
            exit 1
          }

          Write-Host "============================================"
          Write-Host "  🌐 noVNC READY – Eiciel OS"
          Write-Host "============================================"
          Write-Host "  Open this URL in your browser:"
          Write-Host "  $tunnelUrl"
          Write-Host "  Password: 1234"
          Write-Host "============================================"
          Write-Host "  The tunnel stays active until you cancel the workflow."

          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "❌ Cloudflared exited. Tunnel down."
              exit 1
            }
          }
