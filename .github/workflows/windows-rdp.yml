name: Run Test 9 Only

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remove conflicting test files in the root
      - name: Clean up root test files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Build the protected app
      - name: Build protected app
        run: bash build-protected.sh
        shell: bash

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run only test 9 (use the full title or a unique substring)
      - name: Run test 9
        run: |
          cd eiciel-electron
          npm test -- --grep "System shutdown on breach should trigger automatically"
        env:
          EICIEL_TEST_MODE: 1
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots if any
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            eiciel-electron/screenshot-*.png
