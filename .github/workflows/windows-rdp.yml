name: Build Eiciel OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ─── 1. Checkout ─────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── 2. Install tools ────────────────────────────────
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-efi-amd64-bin grub-pc-bin \
            syslinux-utils isolinux \
            nodejs npm

      # ─── 3. Create the Electron app source ───────────────
      # build-protected.sh creates eiciel-electron/ with all source
      # files. Steps that target Windows may fail — we ignore those.
      - name: Create Electron app source
        run: |
          chmod +x build-protected.sh
          bash build-protected.sh || true
          echo ""
          echo "=== After build-protected.sh ==="
          ls -la eiciel-electron/ 2>/dev/null || echo "❌ eiciel-electron not created"

      # ─── 4. Build the ISO ────────────────────────────────
      # build-eiciel-os.sh repackages the app for Linux and builds the ISO
      - name: Build ISO
        run: |
          chmod +x build-eiciel-os.sh
          sudo -E bash build-eiciel-os.sh || true

      # ─── 5. Upload logs always ───────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-logs
          path: |
            bootstrap.log
            chroot.log
            binary.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      # ─── 6. Upload ISO if produced ───────────────────────
      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eiciel-os-iso
          path: eiciel-os.iso
          retention-days: 30
          compression-level: 0
