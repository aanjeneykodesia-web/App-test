name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Pre-flight: delete old artifacts so the quota stays clear.
  #  Runs in its own job so it happens even if the build fails.
  # ─────────────────────────────────────────────────────────────
  cleanup:
    name: Clean old artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts older than 1 day
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            let deleted = 0, freedBytes = 0;

            for (const repo of [process.env.GITHUB_REPOSITORY]) {
              const [owner, name] = repo.split('/');
              let page = 1;
              while (true) {
                const res = await github.rest.actions.listArtifactsForRepo({
                  owner, repo: name, per_page: 100, page,
                });
                if (res.data.artifacts.length === 0) break;

                for (const a of res.data.artifacts) {
                  const created = new Date(a.created_at).getTime();
                  if (created < cutoff) {
                    try {
                      await github.rest.actions.deleteArtifact({
                        owner, repo: name, artifact_id: a.id,
                      });
                      deleted++;
                      freedBytes += a.size_in_bytes || 0;
                      console.log(`deleted  ${a.name}  id=${a.id}  ${(a.size_in_bytes/1e6).toFixed(1)} MB`);
                    } catch (e) {
                      console.log(`skip     ${a.name}  id=${a.id}  (${e.message})`);
                    }
                  } else {
                    console.log(`keep     ${a.name}  id=${a.id}  (age ${((Date.now()-created)/3600000).toFixed(1)}h)`);
                  }
                }
                if (res.data.artifacts.length < 100) break;
                page++;
              }
            }

            console.log(`\nDeleted ${deleted} artifact(s), freed ~${(freedBytes/1e6).toFixed(1)} MB.`);

  # ─────────────────────────────────────────────────────────────
  #  Build app + ISO. Runs after cleanup.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build app + ISO
    needs: cleanup
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: debian:bookworm
      options: --privileged --cgroupns=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 20
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
            | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
          echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" \
            > /etc/apt/sources.list.d/nodesource.list
          apt-get update -qq
          apt-get install -y -qq nodejs
          node --version
          npm --version

      - name: Install build dependencies
        run: |
          apt-get install -y -qq \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-efi-amd64-bin \
            grub-pc-bin \
            ca-certificates \
            git \
            curl \
            jq \
            openssl

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build app + ISO
        env:
          MGMT_IP:            ${{ secrets.MGMT_IP }}
          WEBHOOK_URL:        ${{ secrets.WEBHOOK_URL }}
          SSH_AUTHORIZED_KEY: ${{ secrets.SSH_AUTHORIZED_KEY }}
        run: ./scripts/build-eiciel.sh all

      - name: Verify ISO
        run: |
          ls -lh eiciel-server.iso
          file eiciel-server.iso

      - name: Inspect ISO contents
        run: |
          set -e
          mkdir -p /mnt/iso
          mount -o loop eiciel-server.iso /mnt/iso
          echo "── ISO root ──"
          ls -la /mnt/iso
          echo "── /live ──"
          ls -lh /mnt/iso/live/
          echo "── squashfs ──"
          du -h /mnt/iso/live/filesystem.squashfs
          echo "── installer tree ──"
          ls -d /mnt/iso/install* 2>/dev/null || echo "(no installer tree)"
          echo "── EFI ──"
          ls -la /mnt/iso/EFI/BOOT/ 2>/dev/null || true
          umount /mnt/iso

      # Small logs only — cheap, useful for debugging failures.
      # Does not exceed quota (a few MB).
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            bootstrap.log
            chroot.log
            binary.log
          retention-days: 1
          if-no-files-found: ignore

      # ISO goes to Releases only — does not consume artifact quota.
      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: eiciel-server.iso
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  #  Post-build: delete this run's artifacts immediately.
  #  Only when triggered manually. Skip on tag pushes so release
  #  assets (which are separate from artifacts) are preserved.
  # ─────────────────────────────────────────────────────────────
  post-cleanup:
    name: Post-build cleanup
    needs: build
    if: always() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');

            const res = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id,
            });

            for (const a of res.data.artifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: a.id,
                });
                console.log(`deleted  ${a.name}  id=${a.id}`);
              } catch (e) {
                console.log(`skip     ${a.name}  id=${a.id}  (${e.message})`);
              }
            }

            console.log('done');
