name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ─── Cache node_modules ──────────────────────────────────────
      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ─── Build the app (includes full test file creation) ──────
      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── Install Playwright browsers (if cache missed) ─────────
      - name: Install Playwright browsers
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd ./app/eiciel-electron
          npx playwright install chromium
        shell: bash

      # ─── Debug: list test files (optional) ──────────────────────
      - name: List test files
        run: |
          cd ./app/eiciel-electron
          dir tests
        shell: bash

      # ─── Run the security tests (all 7) ────────────────────────
      - name: Run Security Tests
        run: |
          cd ./app/eiciel-electron
          npm test
        shell: bash
        env:
          CI: true
