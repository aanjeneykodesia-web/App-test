name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── Copy your custom security test file ──────────────────
      - name: Copy Security Test File
        run: |
          cd ./app
          # Assuming your security test file is at the repo root
          # If you have a separate security-test.spec.js, copy it
          cp security-attacks.spec.js eiciel-electron/tests/ 2>/dev/null || echo "No custom test file, using default."
        shell: bash

      - name: Install Playwright
        run: |
          cd ./app/eiciel-electron
          npm install
          npx playwright install chromium
        shell: bash

      - name: List test files
        run: |
          cd ./app/eiciel-electron
          dir tests
        shell: bash

      - name: Run Security Tests
        run: |
          cd ./app/eiciel-electron
          npx playwright test
        shell: bash
        env:
          CI: true
