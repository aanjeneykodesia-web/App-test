name: Build and Test Eiciel OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ─── Create a fake D: drive pointing to a temp folder ──────
      - name: Create D: drive mapping
        shell: pwsh
        run: |
          # Create a folder on C: that will act as the root for D:
          $targetFolder = "C:\build_data"
          New-Item -ItemType Directory -Force -Path $targetFolder
          # Map D: to that folder (subst)
          subst D: $targetFolder

      - name: Build Eiciel OS
        shell: bash
        run: |
          # Make the build script executable
          chmod +x deepseek_bash_20260907_a588e2.sh
          # Run it – it will output to D:/data/EicielOS as per package.json
          bash deepseek_bash_20260907_a588e2.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        env:
          EICIEL_TEST_MODE: 1

      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: EicielOS-win32-x64
          # This path matches the one in package.json
          path: D:/data/EicielOS/EicielOS-win32-x64/

      # ─── (Optional) Clean up the D: mapping ──────────────────
      - name: Remove D: drive mapping
        if: always()
        shell: pwsh
        run: subst D: /D
