name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Build and test
        run: |
          chmod +x build-protected.sh
          ./build-protected.sh
          cd eiciel-electron
          npx playwright test
