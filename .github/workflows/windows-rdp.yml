name: Build & Test Eiciel OS (Playwright)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS (protected)
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Install Playwright browsers
        run: |
          cd app
          npx playwright install chromium

      - name: Run Playwright tests (functional + security bot)
        run: |
          cd app
          npm run test
        shell: bash
        env:
          CI: ""

      - name: Run security bot attacks (separate suite)
        run: |
          cd app
          npm run test:attack
        shell: bash
        env:
          CI: ""
