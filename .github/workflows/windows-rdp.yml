name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install UltraVNC
        run: |
          choco install ultravnc -y --limit-output
          Start-Sleep -Seconds 10
          $installDir = "C:\Program Files\uvnc bvba\UltraVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\UltraVNC",
              "C:\Program Files (x86)\UltraVNC",
              "C:\Program Files\uvnc bvba\UltraVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }
          if (-not (Test-Path $installDir)) {
            Write-Host "❌ UltraVNC not found"
            exit 1
          }
          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ UltraVNC installed at $installDir"

      - name: Configure VNC for empty password
        run: |
          New-Item -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "AllowNullPassword" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\UVNC\UltraVNC" -Name "AuthRequired" -Value 0 -Type DWord
          Write-Host "✅ VNC configured to allow empty passwords"

      - name: Start VNC server
        run: |
          $vncServer = "$env:VNC_PATH\winvnc.exe"
          Start-Process -FilePath $vncServer -ArgumentList "-run -desktop" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          netstat -an | findstr :5900
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Port 5900 not listening"
            exit 1
          }
          Write-Host "✅ VNC server running with NO password"

      - name: Setup noVNC web client
        run: |
          python -m pip install websockify
          if (-not (Test-Path "C:\noVNC")) {
            git clone --depth=1 https://github.com/novnc/noVNC.git C:\noVNC
          }
          # Redirect root to vnc_lite.html
          echo '<meta http-equiv="refresh" content="0;url=vnc_lite.html">' > C:\noVNC\index.html

          $conn = Get-NetTCPConnection -LocalPort 6080 -ErrorAction SilentlyContinue
          if ($conn) { Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          $logOut = "$env:TEMP\websockify_out.log"
          $logErr = "$env:TEMP\websockify_err.log"
          Start-Process -FilePath "python" -ArgumentList "-m websockify --web C:\noVNC --verbose 6080 localhost:5900" -RedirectStandardOutput $logOut -RedirectStandardError $logErr -WindowStyle Hidden -PassThru

          $maxAttempts = 15
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $conn = Get-NetTCPConnection -LocalPort 6080 -ErrorAction SilentlyContinue
            if ($conn -and $conn.State -eq 'Listen') { break }
            Start-Sleep -Seconds 2
            $attempt++
            Write-Host "Waiting for websockify... $($attempt+1)/$maxAttempts"
          }
          if ($attempt -ge $maxAttempts) {
            Write-Host "❌ websockify failed to bind port 6080"
            Write-Host "stdout log:"
            Get-Content $logOut
            Write-Host "stderr log:"
            Get-Content $logErr
            exit 1
          }

          try {
            $response = Invoke-WebRequest -Uri "http://localhost:6080" -UseBasicParsing -TimeoutSec 3
            Write-Host "✅ websockify responded with status $($response.StatusCode)"
          } catch {
            Write-Host "⚠️ websockify HTTP request failed, but port is open – continuing."
          }

          Write-Host "✅ noVNC ready on http://localhost:6080"

      - name: Expose VNC via Cloudflare (authenticated)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Use the API token to create a quick tunnel with your account
          # This will produce a stable .trycloudflare.com URL with WebSocket support
          $outFile = "$env:TEMP\cloudflared_out.log"
          $errFile = "$env:TEMP\cloudflared_err.log"
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url http://localhost:6080 --protocol http2 --loglevel debug" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru

          $maxAttempts = 40
          $attempt = 0
          $tunnelUrl = $null
          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 2
            $files = @($outFile, $errFile)
            foreach ($f in $files) {
              if (Test-Path $f) {
                $content = Get-Content $f -Raw
                if ($content -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                  $tunnelUrl = $matches[0]
                  break
                }
              }
            }
            if ($tunnelUrl) { break }
            $attempt++
            Write-Host "Waiting for tunnel URL... attempt $($attempt+1)/$maxAttempts"
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ Could not retrieve tunnel URL."
            Write-Host "stdout log:"
            Get-Content $outFile
            Write-Host "stderr log:"
            Get-Content $errFile
            exit 1
          }

          Write-Host "============================================"
          Write-Host "  🖥️  VNC READY – Eiciel OS"
          Write-Host "============================================"
          Write-Host "  Open this URL in your browser: $tunnelUrl"
          Write-Host "  VNC Password: (leave blank)"
          Write-Host "============================================"

          Wait-Process -Name cloudflared
