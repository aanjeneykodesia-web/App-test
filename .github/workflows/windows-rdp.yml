name: External Bot Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  attack-test:
    runs-on: windows-latest   # Use Windows to match the intended environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build executable (CI=false)
        run: |
          # Force the build (overrides CI detection)
          export CI=false
          npm run build
        shell: bash

      - name: Run external bot attack
        run: node attack-bot.js
        # This will launch the built app or the source app
