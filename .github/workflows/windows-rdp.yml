name: Playwright Tests (9 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remove any conflicting test files in the root
      - name: Clean up root test files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Patch the build script to use ./dist instead of D:/data/EicielOS
      - name: Patch build script to use relative output
        run: |
          (Get-Content build-protected.sh) -replace 'D:/data/EicielOS', './dist' | Set-Content build-protected.sh
        shell: pwsh

      # Run the build script (will now output to ./dist inside eiciel-electron)
      - name: Build protected app
        run: bash build-protected.sh
        shell: bash

      # Remove any stray test files inside eiciel-electron (just in case)
      - name: Clean up inside eiciel-electron
        run: |
          cd eiciel-electron
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests\*.spec.js
        shell: pwsh

      # Patch the test file to use EICIEL_EXE_PATH environment variable
      - name: Patch test file for environment variable
        run: |
          $file = "eiciel-electron/tests/security.spec.js"
          $content = Get-Content $file -Raw
          $newContent = $content -replace "const exePath = path.join\('\./dist', 'EicielOS-win32-x64', 'EicielOS.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join('.', 'dist', 'EicielOS-win32-x64', 'EicielOS.exe');"
          Set-Content $file $newContent
        shell: pwsh

      # Debug: list all test files
      - name: List test files
        run: |
          Get-ChildItem -Recurse -Filter *.spec.js
        shell: pwsh

      # Install Playwright browsers inside eiciel-electron
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run the tests from inside eiciel-electron
      - name: Run Playwright tests
        run: |
          cd eiciel-electron
          npm test
        env:
          EICIEL_TEST_MODE: 1
          # The .exe is now in eiciel-electron/dist/EicielOS-win32-x64/EicielOS.exe
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots if any
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: eiciel-electron/screenshot-*.png
