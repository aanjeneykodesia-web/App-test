name: RDP - Kiosk Mode (Eiciel OS)

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout your app source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build Eiciel OS
        run: |
          cd app
          bash build-and-test.sh
        shell: bash
        env:
          CI: ""

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install UltraVNC
        run: |
          choco install ultravnc -y --limit-output
          Start-Sleep -Seconds 10
          $installDir = "C:\Program Files\uvnc bvba\UltraVNC"
          if (-not (Test-Path $installDir)) {
            $searchPaths = @(
              "C:\Program Files\UltraVNC",
              "C:\Program Files (x86)\UltraVNC",
              "C:\Program Files\uvnc bvba\UltraVNC"
            )
            foreach ($p in $searchPaths) {
              if (Test-Path $p) { $installDir = $p; break }
            }
          }
          if (-not (Test-Path $installDir)) {
            Write-Host "❌ UltraVNC not found"
            exit 1
          }
          echo "VNC_PATH=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ UltraVNC installed at $installDir"

      - name: Configure VNC password and start server
        run: |
          # Kill any existing VNC process
          Get-Process -Name winvnc -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Set password via winvnc -install (writes to registry)
          & "$env:VNC_PATH\winvnc.exe" -install -password 1234

          # Start the VNC server
          Start-Process -FilePath "$env:VNC_PATH\winvnc.exe" -ArgumentList "-run" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          # Verify it's listening
          $listening = netstat -an | Select-String ":5900"
          if ($listening) {
            Write-Host "✅ VNC server listening on port 5900"
            Write-Host $listening
          } else {
            Write-Host "❌ VNC server not listening"
            exit 1
          }

          Write-Host "✅ VNC password set to '1234'"

      - name: Expose VNC via Cloudflare TCP tunnel
        run: |
          $outFile = "$env:TEMP\cf_out.log"
          $errFile = "$env:TEMP\cf_err.log"
          $proc = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:5900 --loglevel debug" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -WindowStyle Hidden -PassThru
          Write-Host "Cloudflared PID: $($proc.Id)"

          $timeout = 90
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $tunnelUrl = $null
          while ($sw.Elapsed.TotalSeconds -lt $timeout) {
            if (Test-Path $outFile) {
              $content = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
              if ($content -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $matches[0]
                break
              }
            }
            if (Test-Path $errFile) {
              $errContent = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
              if ($errContent -match 'https://([a-z0-9-]+\.trycloudflare\.com)') {
                $tunnelUrl = $matches[0]
                break
              }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $tunnelUrl) {
            Write-Host "❌ No tunnel URL found within $timeout seconds."
            Write-Host "stdout tail:"
            Get-Content $outFile -Tail 20 -ErrorAction SilentlyContinue
            Write-Host "stderr tail:"
            Get-Content $errFile -Tail 20 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force
            exit 1
          }

          $hostname = $tunnelUrl -replace 'https://',''
          Write-Host "============================================"
          Write-Host "  🖥️  VNC READY – Eiciel OS"
          Write-Host "============================================"
          Write-Host "  Connect using any VNC client:"
          Write-Host "  Host: $hostname"
          Write-Host "  Port: 5900"
          Write-Host "  Password: 1234"
          Write-Host "============================================"
          Write-Host "  Tunnel is active – keep this workflow running."
          Write-Host "  Cancel the run when you're done."

          # Keep alive – check if cloudflared dies
          while ($true) {
            Start-Sleep -Seconds 30
            if ($proc.HasExited) {
              Write-Host "❌ Cloudflared exited. Tunnel down."
              exit 1
            }
          }
