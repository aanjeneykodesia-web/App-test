name: Build Eiciel OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-efi-amd64-bin grub-pc-bin \
            syslinux-utils isolinux \
            nodejs npm

      - name: Build ISO
        run: |
          chmod +x build-eiciel-os.sh
          sudo -E bash build-eiciel-os.sh || true

      # ─── Upload logs always ─────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-logs
          path: |
            bootstrap.log
            chroot.log
            binary.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      # ─── Upload ISO if produced ─────────────────────────
      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eiciel-os-iso
          path: eiciel-os.iso
          retention-days: 30
          compression-level: 0
