name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      EICIEL_TEST_MODE: '1'
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            app/eiciel-electron/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('app/eiciel-electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      # ─── DEBUG STEPS ────────────────────────────────────────────
      - name: Show loader log
        run: |
          if (Test-Path "$env:APPDATA\eiciel_loader.log") {
            Get-Content "$env:APPDATA\eiciel_loader.log"
          } else {
            Write-Host "Loader log not found."
          }
        shell: pwsh

      - name: List packaged app files
        run: |
          dir "D:/data/EicielOS/EicielOS-win32-x64/resources/app"
        shell: bash

      - name: Debug app startup manually
        run: |
          timeout 15 "D:/data/EicielOS/EicielOS-win32-x64/EicielOS.exe" --enable-logging --log-level=0 || echo "App exited with code $?"
        shell: bash
      # ─── END DEBUG ──────────────────────────────────────────────

      - name: Reinstall dependencies in packaged app
        run: |
          cd "D:/data/EicielOS/EicielOS-win32-x64/resources/app"
          npm install --production --no-fund --no-audit
        shell: bash

      - name: Install Playwright browsers (if cache missed)
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd ./app/eiciel-electron
          npx playwright install chromium
        shell: bash

      - name: Run Security Tests (5-7 only)
        run: |
          cd ./app/eiciel-electron
          npx playwright test -g "System and internet controls|Internet is allowed only when browser is open|Self‑destruct on exit should trigger" --reporter=line
        shell: bash
        env:
          CI: true
          EICIEL_TEST_MODE: '1'
          NODE_OPTIONS: "--max-old-space-size=8192"
          DEBUG: pw:electron   # 👈 adds Playwright Electron debug logs
