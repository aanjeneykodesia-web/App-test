name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the protected app
        # This runs your build script (which creates the .exe and test files)
        run: |
          bash build-protected.sh
        shell: bash

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run tests
        run: npm test
        env:
          EICIEL_TEST_MODE: 1
          # Tell the test where to find the .exe (adjust path if needed)
          EICIEL_EXE_PATH: D:/data/EicielOS/EicielOS-win32-x64/EicielOS.exe
