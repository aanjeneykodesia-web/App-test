name: External Bot Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # enables manual trigger from UI

jobs:
  attack-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Eiciel OS (CI=false)
        run: |
          # Override CI environment variable to force build
          $env:CI = "false"
          npm run build
        shell: pwsh   # PowerShell (cross‑platform)

      - name: Run external bot attack
        run: node attack-bot.js
        # The bot will launch the built .exe or source, as configured
