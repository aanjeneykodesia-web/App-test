name: Playwright Tests (9 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remove conflicting test files in the root
      - name: Clean up root test files
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue *.spec.js
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue tests
        shell: pwsh

      # Patch the build script to change output to ./dist
      - name: Patch build script output path
        run: |
          $file = "build-protected.sh"
          (Get-Content $file) -replace 'D:/data/EicielOS', './dist' | Set-Content $file
        shell: pwsh

      # Build the protected app (outputs to eiciel-electron/dist)
      - name: Build protected app
        run: bash build-protected.sh
        shell: bash

      # List the dist folder to confirm the .exe exists
      - name: List dist folder
        run: Get-ChildItem -Recurse eiciel-electron/dist
        shell: pwsh

      # Patch the test file directly: replace the hardcoded path with environment variable
      - name: Patch test file to use EICIEL_EXE_PATH
        run: |
          $file = "eiciel-electron/tests/security.spec.js"
          if (-not (Test-Path $file)) {
            Write-Error "Test file not found!"
            exit 1
          }
          $content = Get-Content $file -Raw
          # Replace the exact line that defines exePath
          $newContent = $content -replace "const exePath = path\.join\('\./dist', 'EicielOS-win32-x64', 'EicielOS\.exe'\);", "const exePath = process.env.EICIEL_EXE_PATH || path.join(__dirname, '..', 'dist', 'EicielOS-win32-x64', 'EicielOS.exe');"
          Set-Content $file $newContent
          Write-Host "Patched successfully. Checking line:"
          Select-String -Path $file -Pattern "exePath"
        shell: pwsh

      # Install Playwright browsers inside eiciel-electron
      - name: Install Playwright browsers
        run: |
          cd eiciel-electron
          npx playwright install
        shell: bash

      # Run the tests from inside eiciel-electron
      - name: Run Playwright tests
        run: |
          cd eiciel-electron
          npm test
        env:
          EICIEL_TEST_MODE: 1
          EICIEL_EXE_PATH: ./dist/EicielOS-win32-x64/EicielOS.exe
        shell: bash

      # Upload screenshots if any
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            eiciel-electron/screenshot-*.png
            eiciel-electron/dist/
