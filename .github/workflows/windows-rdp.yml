name: Playwright Security Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Eiciel OS
        uses: actions/checkout@v4
        with:
          repository: aanjeneykodesia-web/App-test   # <-- replace with your repo
          path: app
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Eiciel OS
        run: |
          cd ./app
          chmod +x build-protected.sh
          bash build-protected.sh
        shell: bash

      - name: Install Playwright
        run: |
          cd ./app/eiciel-electron
          npm install
          npx playwright install chromium
        shell: bash

      # ─── Debug: list files to confirm test file exists ──
      - name: List files
        run: |
          cd ./app/eiciel-electron
          dir
        shell: bash

      # ─── Run the security tests ────────────────────────────
      - name: Run Security Tests
        run: |
          cd ./app/eiciel-electron
          npx playwright test
        shell: bash
        env:
          CI: true
